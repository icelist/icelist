# =========================================================
# 1688 / 拼多多 商品批量抓取配置
# =========================================================

# 要抓取的平台，支持 alibaba1688 / pinduoduo，可任意组合
platforms:
  - alibaba1688
  - pinduoduo

# 关键词列表（每个关键词都会在每个启用的平台上跑一轮）
keywords:
  - 蓝牙耳机
  - 充电宝
  - 保温杯

# 也可以直接指定商品详情页 URL（关键词为空时启用）
urls: []

# 每个关键词每个平台抓取多少件商品
per_keyword_limit: 30

# 翻页深度（搜索结果页数）
max_pages: 2

# 下载图片到本地（False 则只记录 URL）
download_images: true

# 价格区间分桶（用于输出时按价格分类）
price_buckets:
  - { name: "0-50",     min: 0,    max: 50 }
  - { name: "50-200",   min: 50,   max: 200 }
  - { name: "200-500",  min: 200,  max: 500 }
  - { name: "500-2000", min: 500,  max: 2000 }
  - { name: "2000+",    min: 2000, max: 999999999 }

# 商品类型关键词映射（命中标题/类目即归类，可自由扩展）
type_rules:
  数码电器:   ["耳机", "音箱", "充电宝", "数据线", "充电器", "手机", "电脑", "平板"]
  家居日用:   ["保温杯", "水杯", "毛巾", "牙刷", "收纳", "拖鞋", "枕头"]
  服饰鞋包:   ["T恤", "卫衣", "外套", "鞋", "包", "袜子", "帽"]
  美妆个护:   ["面膜", "口红", "洗发", "护肤", "香水", "剃须"]
  食品饮料:   ["零食", "饮料", "咖啡", "茶", "牛奶", "坚果"]
  母婴玩具:   ["奶粉", "尿不湿", "玩具", "婴儿", "童装"]
  其他:       []   # 兜底

# 浏览器与反爬
browser:
  headless: false              # 1688/PDD 建议 false（headless 容易触发风控）
  user_data_dir: ".browser_profile"   # 持久化登录态
  page_load_timeout: 30
  request_interval: [1.5, 3.5] # 每次请求随机间隔（秒）

# 输出
output:
  dir: "output"
  excel: true                  # 多 Sheet：按"类型"分 Sheet
  json: true
  images_dir: "output/images"  # download_images=true 时使用

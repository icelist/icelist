# 非敏感配置（可随代码提交到 git；敏感 key 通过 GUI 保险箱管理）

# 每条链的全局参数
chains:
  solana:
    slippage_bps: 500              # 5%
    priority_fee_lamports: 100000
    max_position_usd: 50           # 单笔最大 50 美元
  ethereum:
    slippage_bps: 300              # 3%
    gas_boost_pct: 20              # gas 价加价 20% 抢跑
    max_position_usd: 100
  bsc:
    slippage_bps: 500
    gas_boost_pct: 15
    max_position_usd: 50
  base:
    slippage_bps: 300
    max_position_usd: 100

# 风控（全局）
risk:
  max_daily_loss_usd: 200
  max_open_positions: 5
  stop_loss_pct: 50                # 跌 50% 止损
  take_profit_pct: 200             # 涨 200% 止盈

# 策略参数
strategies:
  sniper:
    min_liquidity_usd: 5000
    max_buy_tax_pct: 10
    require_lp_lock: false

  copytrade:
    target_wallets: []             # 要跟单的钱包地址
    copy_ratio: 0.05

  launchpad:
    eth_targets: []
    bsc_targets: []
    # 示例：
    # eth_targets:
    #   - name: "XYZ Legion"
    #     contract: "0xabc..."
    #     start_ts: 1735689600

  # CEX-DEX 套利配置
  arbitrage:
    # 最小价差百分比（低于此值不执行）
    min_spread_pct: 0.3
    # 最小净利润（美元）
    min_profit_usd: 2.0
    # 单次最大交易金额（美元）
    max_trade_usd: 500
    # 单次最小交易金额（美元）
    min_trade_usd: 50
    # CEX 手续费率（0.001 = 0.1%）
    cex_fee_rate: 0.001
    # DEX 滑点预估百分比
    dex_slippage_pct: 0.3
    # 最大 Gas 价格（Gwei），超过不执行
    max_gas_gwei: 50
    # 最大同时套利笔数
    max_concurrent: 3
    # 同一交易对冷却时间（秒）
    cooldown_seconds: 10
    # 执行模式: "atomic"（先完成一端再执行另一端）/ "parallel"（两端同时提交）
    execution_mode: "atomic"
    # 扫描间隔（秒）
    scan_interval: 2.0
    # 监控的交易对（留空则使用默认列表）
    # pairs:
    #   - pair: "ETH/USDT"
    #     token_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
    #     chain: "ethereum"

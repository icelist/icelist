name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write   # 允许创建 Release 并上传产物

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Quick import test
        run: |
          python -c "import app; print('app module OK')"
          python -c "from gui.main_window import MainWindow; print('GUI OK')"
          python -c "from functions import REGISTRY; assert len(REGISTRY) == 16; print(f'{len(REGISTRY)} functions OK')"

      - name: Build exe with PyInstaller
        run: pyinstaller chain-sniper.spec --clean --noconfirm

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "dist/ChainSniper.exe" ]; then
            echo "ChainSniper.exe not found!"
            ls -la dist/
            exit 1
          fi
          ls -lh dist/ChainSniper.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainSniper-Windows-${{ github.sha }}
          path: dist/ChainSniper.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChainSniper.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build app
        run: pyinstaller chain-sniper.spec --clean --noconfirm

      - name: Tarball .app
        run: |
          cd dist
          if [ -d "ChainSniper.app" ]; then
            tar -czf ChainSniper-macOS.tar.gz ChainSniper.app
          else
            tar -czf ChainSniper-macOS.tar.gz ChainSniper
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainSniper-macOS-${{ github.sha }}
          path: dist/ChainSniper-macOS.tar.gz
          retention-days: 30

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChainSniper-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
